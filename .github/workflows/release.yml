name: Build desktop downloads
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller pytest
      - run: python -m pytest
      - run: python -m PyInstaller --onefile --windowed --name calculator-${{ runner.os }} main.py
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-${{ runner.os }}
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
